<style>
/* ===================================================
   DESIGN TOKENS & SYSTEM STYLES — UPT SMPN 1 SUPPA
   Berdasarkan DESIGN.md & UI/UX Stitch Production
   =================================================== */

:root {
  /* Brand Colors */
  --primary: #1E4FD8;
  --primary-hover: #1A42B8;
  --primary-container: #E4ECFF;
  --on-primary-container: #1E3A8A;
  --secondary: #0D9488;
  --secondary-container: #DDF4F1;
  --on-secondary-container: #0F766E;

  /* Neutral & Surfaces */
  --background: #F5F7FB;
  --surface: #FFFFFF;
  --surface-subtle: #F1F4F9;
  --surface-sidebar: #0F1B33;
  --border: #E3E8F0;
  --border-strong: #C7D0DE;
  --text-primary: #101828;
  --text-secondary: #475467;
  --text-muted: #98A2B3;
  --text-on-dark: #EAF0FF;

  /* Semantic Status */
  --status-critical: #DC2626;
  --status-critical-bg: #FEE4E2;
  --status-critical-text: #B42318;

  --status-warning: #D97706;
  --status-warning-bg: #FEF3E0;
  --status-warning-text: #B54708;

  --status-info: #2563EB;
  --status-info-bg: #E8EFFE;
  --status-info-text: #1D4ED8;

  --status-success: #16A34A;
  --status-success-bg: #E7F7EC;
  --status-success-text: #15803D;

  --status-purple: #7C3AED;
  --status-purple-bg: #F3E8FF;
  --status-purple-text: #7C3AED;

  --status-neutral: #475467;
  --status-neutral-bg: #EEF1F5;

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.14);

  /* Fonts */
  --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  background-color: var(--background);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6, .font-heading {
  font-family: var(--font-heading);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

/* ===================================================
   LAYOUT & CONTAINER
   =================================================== */
.app-wrapper {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* Sidebar */
.sidebar {
  width: 256px;
  background-color: var(--surface-sidebar);
  color: var(--text-on-dark);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  z-index: 40;
  transition: all 0.3s ease;
}

.sidebar-brand {
  padding: 24px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.brand-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #1E4FD8 0%, #0D9488 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 4px 10px rgba(30, 79, 216, 0.3);
}

.sidebar-nav {
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-grow: 1;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  color: rgba(234, 240, 255, 0.72);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}

.nav-item:hover {
  background-color: rgba(255, 255, 255, 0.07);
  color: #FFFFFF;
}

.nav-item.active {
  background-color: rgba(30, 79, 216, 0.24);
  color: #FFFFFF;
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 3.5px;
  background-color: var(--secondary);
  border-radius: 0 4px 4px 0;
}

.nav-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.sidebar-footer {
  padding: 16px 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Header */
.main-content {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  overflow-y: auto;
}

.global-header {
  height: 68px;
  background-color: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 30;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.header-search {
  position: relative;
  width: 340px;
}

.header-search input {
  width: 100%;
  height: 38px;
  padding: 8px 12px 8px 36px;
  background-color: var(--surface-subtle);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: all 0.2s ease;
}

.header-search input:focus {
  border-color: var(--primary);
  background-color: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(30, 79, 216, 0.12);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Page Container */
.page-container {
  padding: 28px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* ===================================================
   BUTTONS
   =================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  padding: 9px 18px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn-primary {
  background-color: var(--primary);
  color: #FFFFFF;
  box-shadow: var(--shadow-xs);
}

.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-secondary {
  background-color: #FFFFFF;
  color: var(--primary);
  border-color: var(--border-strong);
}

.btn-secondary:hover {
  background-color: var(--primary-container);
}

.btn-outline-green {
  background-color: #FFFFFF;
  color: var(--secondary);
  border-color: var(--secondary);
}

.btn-outline-green:hover {
  background-color: var(--secondary-container);
}

.btn-ghost {
  background-color: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background-color: var(--surface-subtle);
  color: var(--text-primary);
}

.btn-danger {
  background-color: var(--status-critical);
  color: #FFFFFF;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}

.btn-lg {
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
}

/* ===================================================
   CARDS & PANELS
   =================================================== */
.card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 22px;
}

.kpi-card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  position: relative;
}

.kpi-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.kpi-value {
  font-family: var(--font-heading);
  font-size: 32px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.1;
}

.kpi-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  width: fit-content;
}

/* ===================================================
   BADGES & STATUS PILLS (DESIGN.md Section 14)
   =================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  white-space: nowrap;
}

.badge-critical {
  background-color: var(--status-critical-bg);
  color: var(--status-critical-text);
}

.badge-warning {
  background-color: var(--status-warning-bg);
  color: var(--status-warning-text);
}

.badge-info {
  background-color: var(--status-info-bg);
  color: var(--status-info-text);
}

.badge-success {
  background-color: var(--status-success-bg);
  color: var(--status-success-text);
}

.badge-purple {
  background-color: var(--status-purple-bg);
  color: var(--status-purple-text);
}

.badge-neutral {
  background-color: var(--status-neutral-bg);
  color: var(--status-neutral);
}

/* ===================================================
   TABLES (DESIGN.md Section 10)
   =================================================== */
.table-container {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.data-table th {
  background-color: var(--surface-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-strong);
}

.data-table td {
  padding: 15px 18px;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td {
  background-color: rgba(228, 236, 255, 0.4);
}

/* ===================================================
   FORMS & INPUTS
   =================================================== */
.form-group {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  height: 40px;
  padding: 8px 14px;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text-primary);
  background-color: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: all 0.15s ease;
}

.form-textarea {
  height: auto;
  min-height: 90px;
  resize: vertical;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(30, 79, 216, 0.15);
}

/* ===================================================
   MODAL & OVERLAYS
   =================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(16, 24, 40, 0.55);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  background-color: var(--surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
}

.modal-footer {
  padding: 18px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  background-color: var(--surface-subtle);
  border-bottom-left-radius: var(--radius-xl);
  border-bottom-right-radius: var(--radius-xl);
}

/* ===================================================
   PRINT SHEET / OFFICIAL REPORT (A4 KOP SURAT)
   =================================================== */
.report-paper {
  background-color: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 36px 40px;
  box-shadow: var(--shadow-sm);
  font-family: 'Times New Roman', Times, serif;
  color: #000000;
  line-height: 1.4;
}

.kop-surat {
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 3px double #000000;
  padding-bottom: 12px;
  margin-bottom: 20px;
  text-align: center;
}

.kop-logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
}

.kop-teks {
  flex-grow: 1;
}

.kop-teks h3 {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.05em;
  margin: 0;
}

.kop-teks h2 {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 0.05em;
  margin: 2px 0;
}

.kop-teks h1 {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0.08em;
  margin: 2px 0;
}

.kop-teks p {
  font-size: 11px;
  margin: 2px 0;
}

.report-title {
  text-align: center;
  text-decoration: underline;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 4px;
  letter-spacing: 0.05em;
}

.report-number {
  text-align: center;
  font-size: 12px;
  margin-bottom: 16px;
}

.meta-table {
  width: 100%;
  font-size: 12px;
  margin-bottom: 16px;
  border-collapse: collapse;
}

.meta-table td {
  padding: 3px 6px;
}

.report-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-bottom: 20px;
}

.report-table th, .report-table td {
  border: 1px solid #000000;
  padding: 6px 8px;
}

.report-table th {
  background-color: #F0F0F0;
  font-weight: bold;
  text-align: center;
}

.signature-grid {
  display: flex;
  justify-content: space-between;
  margin-top: 36px;
  font-size: 12px;
  text-align: center;
}

.signature-col {
  width: 30%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.signature-space {
  height: 65px;
}

.signature-name {
  font-weight: bold;
  text-decoration: underline;
}

/* ===================================================
   RESPONSIVE DESIGN
   =================================================== */
@media (max-width: 1024px) {
  .sidebar {
    width: 72px;
  }
  .sidebar-brand span, .nav-item span, .sidebar-footer {
    display: none;
  }
  .sidebar-brand {
    justify-content: center;
    padding: 16px 0;
  }
  .nav-item {
    justify-content: center;
    padding: 12px 0;
  }
}

@media (max-width: 768px) {
  .app-wrapper {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    height: auto;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    flex-direction: row;
    justify-content: space-around;
    padding: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-right: none;
  }
  .sidebar-brand, .sidebar-footer {
    display: none;
  }
  .sidebar-nav {
    flex-direction: row;
    padding: 0;
    gap: 2px;
  }
  .nav-item.active::before {
    top: 0;
    bottom: auto;
    left: 6px;
    right: 6px;
    height: 3px;
    width: auto;
  }
  .main-content {
    margin-bottom: 64px;
    height: calc(100vh - 64px);
  }
  .global-header {
    padding: 0 16px;
  }
  .header-search {
    display: none;
  }
  .page-container {
    padding: 16px;
  }
}

/* Print Rules */
@media print {
  .sidebar, .global-header, .btn, .no-print {
    display: none !important;
  }
  .main-content {
    height: auto;
    overflow: visible;
  }
  .page-container {
    padding: 0;
    max-width: 100%;
  }
  .report-paper {
    border: none;
    box-shadow: none;
    padding: 0;
  }
}
